services:
  app:
    build:
      context: .
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:Z
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: sim_keanggotaan_imm
      MARIADB_USER: sim_user
      MARIADB_PASSWORD: sim_local_password_change_me
      MARIADB_ROOT_PASSWORD: root_local_password_change_me
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql:Z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"

volumes:
  mariadb-data:
